<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hevsel Yöresel Lezzetler</title>
    <style>
        body {
            background-color: #fdfaf5;
            background-image: 
                url('https://www.transparenttextures.com/patterns/arabesque.png'), /* Yöresel motif hissi */
                linear-gradient(135deg, #fdfaf5 25%, #f4f0e6 100%);
            color: #2c2c2c;
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 40px 20px;
        }

        .menu-container {
            max-width: 600px;
            margin: 0 auto;
            background: #fffdf9;
            padding: 40px;
            border: 1px solid #d4c5b9;
            position: relative;
            /* Kenarlara yöresel çerçeve efekti */
            box-shadow: 0 0 0 10px #315a3a, 0 0 0 12px #fdfaf5, 0 0 20px rgba(0,0,0,0.2);
        }

        /* Sayfa Kenarları İçin Yöresel Motif Eklentisi */
        .menu-container::before, .menu-container::after {
            content: "🌿";
            position: absolute;
            font-size: 30px;
        }
        .menu-container::before { top: 10px; left: 10px; }
        .menu-container::after { bottom: 10px; right: 10px; }

        .header {
            text-align: center;
            border-bottom: 2px solid #315a3a;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #315a3a;
            font-size: 28px;
            margin: 0;
            text-transform: uppercase;
        }
        .header p {
            color: #555;
            font-style: italic;
            font-size: 14px;
        }

        h2 {
            color: #315a3a;
            font-size: 18px;
            border-bottom: 1px solid #315a3a;
            padding-bottom: 5px;
            margin-top: 35px;
        }

        .item { display: flex; justify-content: space-between; padding: 10px 0; }
        .item-name { font-weight: bold; }
        .item-price { font-weight: bold; color: #315a3a; }
        
        .item-with-image {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px dashed #c0b2a5;
        }
        .item-desc { font-size: 12px; color: #666; font-style: italic; max-width: 80%; }
        .photo-box {
            width: 80px; height: 60px;
            background: #e9e4d5;
            border: 2px solid #315a3a;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; color: #315a3a; text-align: center;
        }
    </style>
</head>
<body>

<div class="menu-container">
    <div class="header">
        <h1>HEVSEL YÖRESEL LEZZETLER</h1>
        <p>Diyarbakır’ın kadim mutfağından, kadınlarımızın el emeğiyle…</p>
    </div>

    <!-- Menü İçeriğin Buraya Gelecek -->
    <h2>DİYARBAKIR’IN YÖRESEL LEZZETLERİ</h2>
    <div class="item-with-image">
        <div>
            <div class="item-name">Dolma</div>
            <div class="item-desc">Diyarbakır'ın meşhur baharatlı ve bol yeşillikli özel dolması.</div>
            <div class="item-price">350 TL</div>
        </div>
        <div class="photo-box">YEMEK<br>FOTOĞRAFI</div>
    </div>
    
    <!-- Diğer öğelerini buraya önceki gibi ekleyebilirsin -->

</div>

</body>
</html>
