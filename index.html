<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hevsel Yöresel Lezzetler</title>
    <style>
        body {
            background-color: #fcfbf7; /* Krem arka plan */
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .menu-container {
            width: 100%;
            max-width: 500px;
            background: #fffcf8;
            padding: 40px;
            position: relative;
            /* Köşelerdeki zarif yaprak/yöresel detaylar için ince bir çizgi dokusu */
            border-top: 5px double #315a3a;
            border-bottom: 5px double #315a3a;
        }

        /* Köşe süsleri */
        .menu-container::after {
            content: "❈";
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #315a3a;
            font-size: 24px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #315a3a;
            font-size: 26px;
            margin: 0;
            text-transform: uppercase;
            border-bottom: 1px solid #315a3a;
            display: inline-block;
            padding-bottom: 10px;
        }

        .header p {
            color: #5d6d5e;
            font-style: italic;
            margin-top: 10px;
        }

        h2 {
            color: #315a3a;
            font-size: 16px;
            margin-top: 30px;
            border-left: 3px solid #315a3a;
            padding-left: 10px;
        }

        .item-with-image {
            display: flex;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #e5e0d8;
        }

        .item-info { flex: 1; }
        .item-name { font-weight: bold; color: #222; }
        .item-desc { font-size: 12px; color: #666; margin: 4px 0; }
        .item-price { font-weight: bold; color: #315a3a; }

        .photo-box {
            width: 70px;
            height: 70px;
            background: #f0ede5;
            margin-left: 15px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            color: #777;
            text-align: center;
            border: 1px solid #dcd6cd;
        }
    </style>
</head>
<body>

<div class="menu-container">
    <div class="header">
        <h1>HEVSEL YÖRESEL LEZZETLER</h1>
        <p>Diyarbakır’ın kadim mutfağından, kadınlarımızın el emeğiyle…</p>
    </div>

    <h2>DİYARBAKIR’IN YÖRESEL LEZZETLERİ</h2>
    
    <div class="item-with-image">
        <div class="item-info">
            <div class="item-name">Dolma</div>
            <div class="item-desc">Kadınlarımızın el emeği geleneksel dolma.</div>
            <div class="item-price">350 TL</div>
        </div>
        <div class="photo-box">FOTOĞRAF</div>
    </div>

    <!-- Buraya diğer yemeklerini aynı şekilde ekleyebilirsin -->
    
</div>

</body>
</html>
