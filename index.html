<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hevsel Yöresel Lezzetler</title>
    <style>
        body {
            background-color: #fdfaf5;
            background-image: url('https://www.transparenttextures.com/patterns/arabesque.png'), linear-gradient(135deg, #fdfaf5 25%, #f4f0e6 100%);
            color: #2c2c2c;
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 40px 20px;
        }

        .menu-container {
            max-width: 600px;
            margin: 0 auto;
            background: #fffdf9;
            padding: 40px;
            border: 1px solid #d4c5b9;
            position: relative;
            box-shadow: 0 0 0 10px #315a3a, 0 0 0 12px #fdfaf5, 0 0 20px rgba(0,0,0,0.2);
        }

        /* Köşelere logo yerleşimi */
        .corner-logo {
            position: absolute;
            width: 50px; /* Logo boyutu */
            opacity: 0.6; /* Hafif şeffaflık */
        }
        .top-left { top: 10px; left: 10px; }
        .bottom-right { bottom: 10px; right: 10px; }

        .header { text-align: center; border-bottom: 2px solid #315a3a; padding-bottom: 20px; margin-bottom: 30px; }
        .header h1 { color: #315a3a; font-size: 28px; margin: 0; text-transform: uppercase; }
        .header p { color: #555; font-style: italic; font-size: 14px; }

        h2 { color: #315a3a; font-size: 18px; border-bottom: 1px solid #315a3a; padding-bottom: 5px; margin-top: 35px; }

        .item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px dashed #e5e0d8; }
        .item-name { font-weight: bold; }
        .item-price { font-weight: bold; color: #315a3a; }
        
        .item-with-image { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px dashed #c0b2a5; }
        .item-info { max-width: 75%; }
        .item-desc { font-size: 12px; color: #666; font-style: italic; margin-top: 4px; }
        .photo-box { width: 80px; height: 60px; background: #e9e4d5; border: 2px solid #315a3a; display: flex; align-items: center; justify-content: center; font-size: 9px; color: #315a3a; text-align: center; flex-shrink: 0; margin-left: 15px; }
    </style>
</head>
<body>

<div class="menu-container">
    <!-- Köşe Logoları -->
    <img src="logo.png" class="corner-logo top-left" alt="Logo">
    <img src="logo.png" class="corner-logo bottom-right" alt="Logo">

    <div class="header">
        <h1>HEVSEL YÖRESEL LEZZETLER</h1>
        <p>Diyarbakır’ın kadim mutfağından, kadınlarımızın el emeğiyle…</p>
    </div>

    <!-- Menü İçeriğin Buraya Gelecek -->
    <h2>DİYARBAKIR’IN YÖRESEL LEZZETLERİ</h2>
    
    <div class="item-with-image">
        <div class="item-info">
            <div class="item-name">Dolma</div>
            <div class="item-desc">Diyarbakır sofralarının sevilen, kadınlarımızın el emeğiyle hazırlanan geleneksel lezzetlerinden.</div>
            <div class="item-price" style="margin-top: 6px;">350 TL</div>
        </div>
        <div class="photo-box">FOTOĞRAF</div>
    </div>
    
    <!-- Geri kalan tüm menü içeriğini buradan aşağıya eklemeye devam edebilirsin -->

</div>

</body>
</html>
